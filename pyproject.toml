[project]
name = "ai-system-design-simulator"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["fastapi>=0.116,<1", "httpx>=0.28,<1", "pydantic>=2.11,<3", "python-multipart>=0.0.20,<1", "simpy>=4.1,<5", "uvicorn>=0.35,<1"]

[dependency-groups]
dev = ["pytest>=8.4,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
